version: 7
platforms:
# `__archspec=1` is the CEP 30 provenance version rattler's detection stamps on
# a microarchitecture it recognises, and what pixi wrote for a detected platform
# before the manifest gained the friendly `archspec` key for it. The version is
# not part of the platform's identity, so this lock still satisfies a manifest
# declaring the same microarchitecture.
- name: fast
  subdir: linux-64
  virtual-packages:
  - __archspec=1=skylake
environments:
  default:
    channels:
    - url: https://prefix.dev/conda-forge/
    packages:
      fast:
      - conda: https://prefix.dev/conda-forge/noarch/_r-mutex-1.0.1-anacondar_1.tar.bz2
packages:
