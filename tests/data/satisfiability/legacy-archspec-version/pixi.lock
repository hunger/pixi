version: 7
platforms:
# `__archspec=0=skylake` is what pixi wrote before it stamped the CEP 30
# provenance version (`1` for a microarchitecture the archspec database knows).
# The version is not part of a platform's identity, so this lock still satisfies
# a manifest declaring the same microarchitecture and does not force a re-solve.
- name: fast
  subdir: linux-64
  virtual-packages:
  - __archspec=0=skylake
environments:
  default:
    channels:
    - url: https://prefix.dev/conda-forge/
    packages:
      fast:
      - conda: https://prefix.dev/conda-forge/noarch/_r-mutex-1.0.1-anacondar_1.tar.bz2
