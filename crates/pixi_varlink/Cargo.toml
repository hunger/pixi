[package]
authors.workspace = true
description = "Varlink IPC server/client for pixi, built on the zlink crate"
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "pixi_varlink"
readme.workspace = true
repository.workspace = true
version = "0.1.0"

[dependencies]
# Cross-process exclusive lock on `<data>/.pixi-serve.lock` and
# `<cache>/.pixi-serve.lock`, taken non-blocking at server startup so a
# second `pixi serve` against the same directories refuses with the
# absolute path of the contested lock file.
async-fd-lock = { workspace = true }
# Capability-bound filesystem API. `cap_std::fs::Dir` anchors the
# challenge-file read to the directory FD captured at `Hello` time, so a
# directory-component symlink swap between `Hello` and `Authenticate`
# can't redirect the read.
cap-std = { workspace = true }
fs-err = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
# `libc::O_NOFOLLOW` for the symlink-resistant challenge-file open. The flag
# value differs per platform, so hard-coding is wrong.
libc = { workspace = true }
ordermap = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
# `zlink`'s default features include `tracing`, which turns on zlink's
# connection-layer span/event output through the same subscriber.
zlink = { workspace = true }

# Real install path: solve via dispatcher's `SolvePixiEnvironmentKey`,
# install via dispatcher's `install_pixi_environment` (which transparently
# delegates the binary phase to `pixi_compute_engine`). The daemon
# constructs its own dispatcher per install call against the server's
# `data` / `cache` roots.
pixi_command_dispatcher = { workspace = true }
pixi_path = { workspace = true }
pixi_spec = { workspace = true }
pixi_spec_containers = { workspace = true }
rattler_conda_types = { workspace = true }
rattler_virtual_packages = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
